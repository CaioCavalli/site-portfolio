; PHP settings for hosts that run PHP as FPM/CGI (most shared hosting).
; WAMP (PHP as an Apache module) ignores this file and uses .htaccess instead.
; Changes can take up to 5 minutes to apply on the server.

; Never show errors to visitors; write them to the PHP error log.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Do not reveal the PHP version in the response headers.
expose_php = Off
